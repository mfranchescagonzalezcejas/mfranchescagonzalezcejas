name: Mirror profile to GitLab (all refs pilot)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-gitlab-profile
  cancel-in-progress: false

jobs:
  validate:
    name: Validate mirroring in isolated Git test repositories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate mirror scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Syntax and integration tests (no production credentials)
        shell: bash
        run: |
          bash -n .github/scripts/mirror-gitlab-refs.sh
          bash -n .github/scripts/test-mirror-gitlab-refs.sh
          bash .github/scripts/test-mirror-gitlab-refs.sh

  mirror:
    needs: validate
    if: github.repository == 'mfranchescagonzalezcejas/mfranchescagonzalezcejas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required configuration
        shell: bash
        env:
          MIRROR_SSH_KEY: ${{ secrets.GITLAB_PROFILE_MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.GITLAB_PROFILE_MIRROR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$MIRROR_SSH_KEY" || -z "$MIRROR_KNOWN_HOSTS" ]]; then
            echo "::error::Set GITLAB_PROFILE_MIRROR_SSH_KEY and GITLAB_PROFILE_MIRROR_KNOWN_HOSTS before enabling this workflow."
            exit 1
          fi

      - name: Checkout GitHub source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up GitLab SSH authentication
        shell: bash
        env:
          MIRROR_SSH_KEY: ${{ secrets.GITLAB_PROFILE_MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.GITLAB_PROFILE_MIRROR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$HOME/.ssh/id_ed25519_mirror"
          chmod 600 "$HOME/.ssh/id_ed25519_mirror"
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          unset MIRROR_SSH_KEY MIRROR_KNOWN_HOSTS

      - name: Mirror every GitHub branch and tag to isolated GitLab refs (no force/deletion)
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
          GIT_TERMINAL_PROMPT: "0"
        run: bash .github/scripts/mirror-gitlab-refs.sh
